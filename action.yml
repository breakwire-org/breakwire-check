name: 'Breakwire stack check'
description: 'Fail or warn when a dependency has a Breakwire deadline (shutdown, retirement, required migration) within N days, or an advisory.'
author: 'Breakwire'
branding:
  icon: 'alert-triangle'
  color: 'orange'
inputs:
  path:
    description: 'Directory to scan for package.json, requirements*.txt and pyproject.toml (recursively; node_modules, .git, venvs skipped).'
    default: '.'
  files:
    description: 'Optional: newline- or comma-separated list of manifest files to check instead of scanning.'
    default: ''
  days:
    description: 'Flag deadlines that fall within this many days from today.'
    default: '30'
  on-deadline:
    description: 'fail | warn | ignore for deadlines within `days`.'
    default: 'fail'
  on-advisory:
    description: 'fail | warn | ignore for security advisories. fail applies only when a version pinned in the manifest (==1.2.3 / exact) or package-lock.json is inside an affected range; unpinned dependencies always get a warning.'
    default: 'fail'
  include-dev:
    description: 'Include devDependencies / dev groups.'
    default: 'true'
  base-url:
    description: 'Breakwire API base URL.'
    default: 'https://breakwire.org'
  fail-on-api-error:
    description: 'Fail the step if Breakwire cannot be reached. Default false: an outage never breaks your build.'
    default: 'false'
  timeout-seconds:
    description: 'Per-request timeout.'
    default: '20'
  comment:
    description: 'auto | true | false. Post or update one short PR comment listing affected claims. auto (default) comments on pull_request events when the token has pull-requests: write and skips quietly otherwise; true warns if it cannot comment; false never comments.'
    default: 'auto'
  github-token:
    description: 'Token used for the PR comment. Needs pull-requests: write.'
    default: '${{ github.token }}'
outputs:
  applicable-count:
    description: 'Number of Breakwire claims that apply to the scanned dependencies.'
  flagged-count:
    description: 'Number of claims that triggered warn or fail.'
  report-json:
    description: 'Path to a JSON file with the full result.'
  comment-url:
    description: 'URL of the PR comment that was created or updated (empty if none).'
runs:
  using: 'node24'
  main: 'index.js'
